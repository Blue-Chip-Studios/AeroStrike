<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:512px;height:512px;overflow:hidden;background:#0b121a}
.tile{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 30%,#22344a 0%,#0e1722 70%);clip-path:polygon(44px 0,100% 0,100% calc(100% - 44px),calc(100% - 44px) 100%,0 100%,0 44px)}
.edge{position:absolute;inset:10px;clip-path:polygon(38px 0,100% 0,100% calc(100% - 38px),calc(100% - 38px) 100%,0 100%,0 38px);box-shadow:inset 0 0 0 6px var(--c);opacity:.9}
.label{position:absolute;left:0;right:0;bottom:44px;text-align:center;font:30px Michroma,sans-serif;letter-spacing:.06em;color:#e8eef4}
.sub{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:18px Michroma,sans-serif;color:var(--c)}
svg{position:absolute;left:96px;top:58px;width:320px;height:320px}
</style></head><body>
